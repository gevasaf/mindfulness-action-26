name: v2 worker

# Processes teacher recordings (music mix, transcription, AI rating), publishes
# what the founder approved, and deletes personal data from 30.11.2026
# (design-v2 §9, stack F7). Does nothing until the Supabase secrets are set.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Skip until Supabase is set up
        id: gate
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase secrets are not set yet: nothing to do."; echo "run=false" >> "$GITHUB_OUTPUT"
          else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Tools
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q requests anthropic
      - name: Run
        if: steps.gate.outputs.run == 'true'
        run: python tech/worker/process_submissions.py
