name: Build map data

# Prepares the static data for the circles map (design-v2 §9, stack F8):
# vector tiles for the map rectangle, the CBS list of localities with
# coordinates, and a land outline. Commits the results to the branch it ran on.
on:
  workflow_dispatch:
    inputs:
      maxzoom:
        description: "Highest tile zoom to extract"
        default: "13"
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/map-data.yml"
      - "tech/tools/map/**"

permissions:
  contents: write

concurrency:
  group: map-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: pip install shapely pyshp
      - name: Localities and land outline
        run: python tech/tools/map/build_map_data.py land localities
      - name: Vector tiles (Protomaps build, map rectangle only)
        env:
          GH_TOKEN: ${{ github.token }}
          MAXZOOM: ${{ github.event.inputs.maxzoom || '13' }}
        run: |
          set -euo pipefail
          gh release download --repo protomaps/go-pmtiles --pattern '*Linux_x86_64.tar.gz' --output pmtiles.tar.gz
          tar xzf pmtiles.tar.gz pmtiles
          BUILD=$(curl -sSL https://build-metadata.protomaps.dev/builds.json | python -c "import json,sys; b=json.load(sys.stdin); print(sorted(x['key'] for x in b)[-1])")
          echo "Protomaps build: $BUILD"
          ./pmtiles extract "https://build.protomaps.com/$BUILD" site/assets/map/region.pmtiles --bbox=34.15,29.40,35.95,33.40 --maxzoom="$MAXZOOM"
          ls -l site/assets/map/
          SIZE=$(stat -c %s site/assets/map/region.pmtiles)
          echo "region.pmtiles: $((SIZE/1024/1024)) MB"
          if [ "$SIZE" -gt 95000000 ]; then echo "Too big for git (>95 MB): rerun with a lower maxzoom"; exit 1; fi
          echo "$BUILD (maxzoom $MAXZOOM)" > site/assets/map/region.source.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/map tech/tools/map/localities-missing.txt
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Map data: tiles, localities and land outline (generated by the map-data workflow)"
          git push
