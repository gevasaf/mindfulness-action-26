<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!-- Source of site/assets/share.jpg: the link preview (Open Graph) image, 1200×630.
     WhatsApp and others may crop it to a square, so the text sits in the middle third.
     Regenerate with: node tech/tools/make-assets.mjs -->
<link rel="stylesheet" href="../../site/styles.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; display: grid; place-items: center; background: #f7f3ec; }
  .bg { position: absolute; inset: 0; background: url("../../site/assets/video/hero-poster.jpg") center / cover; filter: saturate(.55) sepia(.15); }
  .veil { position: absolute; inset: 0; background: radial-gradient(ellipse 46% 70% at 50% 50%, rgb(247 243 236 / 94%) 0%, rgb(247 243 236 / 82%) 55%, rgb(247 243 236 / 40%) 100%); }
  .wrap { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .breath { width: 96px; height: 96px; border-radius: 50%; border: 4px solid #6f8a72; background: #e6ece4; box-shadow: 0 0 0 18px rgb(111 138 114 / 14%), 0 0 0 38px rgb(111 138 114 / 7%); margin-bottom: 52px; transform: none; }
  h1 { font-family: var(--brand-font); font-weight: 700; color: #2b2925; font-size: 76px; line-height: 1.1; margin: 0 0 18px; }
  .sub { font-family: var(--sans); font-weight: 600; color: #4f6852; font-size: 28px; margin: 0 0 14px; }
  .brand { font-family: var(--brand-font); font-weight: 700; color: #4f6852; font-size: 34px; margin: 0; }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>
  <div class="wrap">
    <div class="breath" aria-hidden="true"></div>
    <h1>לפני שבוחרים, נושמים</h1>
    <p class="sub">מיינדפולנס לקראת הבחירות לכנסת · 27.10</p>
    <p class="brand">נוֹכְחִים</p>
  </div>
</body>
</html>
